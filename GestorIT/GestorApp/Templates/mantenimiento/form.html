{% extends "base.html" %}

{% block title %}{% if object %}Editar Mantenimiento{% else %}Nuevo Mantenimiento{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Editar Mantenimiento{% else %}Nuevo Mantenimiento{% endif %}</h1>
<div class="actions">
	<a class="btn" href="{% url 'mantenimiento_list' %}">Volver</a>
</div>
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<button class="btn btn-primary" type="submit">Guardar</button>
</form>

<script>
	(function () {
		var tecnicoSelect = document.getElementById("id_tecnico_responsable");
		var proveedorSelect = document.getElementById("id_proveedor_responsable");
		if (!tecnicoSelect || !proveedorSelect) {
			return;
		}
		var proveedorWrap = proveedorSelect.closest("p") || proveedorSelect.parentElement;

		function toggleProveedor() {
			var show = tecnicoSelect.value === "Proveedores";
			if (proveedorWrap) {
				proveedorWrap.style.display = show ? "" : "none";
			}
			if (!show) {
				proveedorSelect.value = "";
			}
		}

		tecnicoSelect.addEventListener("change", toggleProveedor);
		toggleProveedor();
	})();
</script>
{% endblock %}
