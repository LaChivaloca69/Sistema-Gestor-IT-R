{% extends "base.html" %}

{% block title %}{% if object %}Editar Edificio{% else %}Nuevo Edificio{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Editar Edificio{% else %}Nuevo Edificio{% endif %}</h1>
<div class="actions">
	<a class="btn" href="{% url 'edificio_list' %}">Volver</a>
</div>
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<button class="btn btn-primary" type="submit">Guardar</button>
</form>
{% endblock %}
