{% extends "base.html" %}

{% block title %}Crear usuario{% endblock %}

{% block content %}
<h1>Crear usuario</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Crear cuenta</button>
</form>
<p>
    Ya tienes cuenta?
    <a href="{% url 'login' %}">Iniciar sesion</a>
</p>
{% endblock %}
