{% extends "base.html" %}

{% block title %}Eliminar Agenda de mantenimiento{% endblock %}

{% block content %}
<h1>Eliminar Agenda de mantenimiento</h1>
<p>Estas seguro que deseas eliminar "{{ object }}"?</p>
<div class="actions">
	<a class="btn" href="{% url 'agendamantenimiento_list' %}">Volver</a>
</div>
<form method="post">
	{% csrf_token %}
	<button class="btn btn-danger" type="submit">Eliminar</button>
</form>
{% endblock %}
