{% extends "base.html" %}

{% block title %}{% if object %}Editar Puesto{% else %}Nuevo Puesto{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Editar Puesto{% else %}Nuevo Puesto{% endif %}</h1>
<div class="actions">
	<a class="btn" href="{% url 'puesto_list' %}">Volver</a>
</div>
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<button class="btn btn-primary" type="submit">Guardar</button>
</form>
{% endblock %}
