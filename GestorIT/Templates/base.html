<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor IT{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
            color: #222;
        }
        header {
            background: #0f172a;
            color: #fff;
            padding: 1rem 1.5rem;
        }
        header a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            max-width: 1100px;
            margin: 1.5rem auto;
            background: #fff;
            border-radius: 8px;
            padding: 1.2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .actions {
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
            margin-right: 0.35rem;
            cursor: pointer;
        }
        .btn-primary {
            background: #0f766e;
            color: #fff;
            border-color: #0f766e;
        }
        .btn-danger {
            background: #b91c1c;
            color: #fff;
            border-color: #b91c1c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 0.55rem;
            text-align: left;
            vertical-align: top;
            font-size: 0.95rem;
        }
        th {
            background: #f1f5f9;
        }
        ul.model-grid {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.65rem;
        }
        ul.model-grid li a {
            display: block;
            padding: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-decoration: none;
            color: #0f172a;
            background: #f8fafc;
        }
        form p {
            margin-bottom: 0.8rem;
        }
        form input, form select, form textarea {
            width: 100%;
            max-width: 100%;
            padding: 0.45rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .helptext {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
        .errorlist {
            color: #b91c1c;
            margin: 0.2rem 0;
            padding-left: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home' %}">Gestor IT</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
