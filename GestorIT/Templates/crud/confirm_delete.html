{% extends 'base.html' %}

{% block title %}Eliminar - {{ modelo_nombre }}{% endblock %}

{% block content %}
<h1>Eliminar registro</h1>
<p>Seguro que deseas eliminar este elemento?</p>
<p><strong>{{ object }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Si, eliminar</button>
    <a class="btn" href="{% url 'modelo-list' model_slug=model_slug %}">Cancelar</a>
</form>
{% endblock %}
