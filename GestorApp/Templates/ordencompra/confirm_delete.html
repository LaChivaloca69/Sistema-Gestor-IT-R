{% extends "base.html" %}

{% block title %}Eliminar orden{% endblock %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
	<div>
		<p class="eyebrow mb-2">Ordenes de compra</p>
		<h1 class="h3 mb-1">Eliminar orden</h1>
	</div>
	<a class="btn btn-outline-secondary" href="{% url 'ordencompra_list' %}">Volver</a>
</div>

<div class="card shadow-sm border-0">
	<div class="card-body">
		<p>¿Seguro que deseas eliminar la orden <strong>{{ object.folio_orden }}</strong>?</p>
		<form method="post" class="d-flex gap-2 justify-content-end">
			{% csrf_token %}
			<a class="btn btn-outline-secondary" href="{% url 'ordencompra_list' %}">Cancelar</a>
			<button class="btn btn-danger" type="submit">Eliminar</button>
		</form>
	</div>
</div>

{% endblock %}
