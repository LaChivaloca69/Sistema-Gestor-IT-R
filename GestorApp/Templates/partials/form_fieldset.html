<fieldset>
	<legend>{{ legend|default:"Datos" }}</legend>
	{% for field in form.hidden_fields %}{{ field }}{% endfor %}
	{% for field in form.visible_fields %}
	<div class="form-row{% if field.field.required %} field-required{% endif %}{% if field.errors %} field-error{% endif %}" id="row-{{ field.name }}">
		<p>
			{{ field.label_tag }}
			{{ field }}
			{{ field.errors }}
			{% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}
		</p>
	</div>
	{% endfor %}
</fieldset>
